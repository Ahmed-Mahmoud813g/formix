version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: formix-postgres
    environment:
      POSTGRES_USER: formix
      POSTGRES_PASSWORD: formix
      POSTGRES_DB: formix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: formix-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
